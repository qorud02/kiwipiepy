name: Verify weakref cleanup on Windows
on:
  push:
    branches: [codex/verify-weakref-windows-20261112]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install published baseline and build dependencies
        run: python -m pip install 'kiwipiepy==0.24.0' 'setuptools>=77' wheel pytest cmake
      - name: Verify published baseline in isolated processes
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/ci/weakref_windows_probe.py" --expect baseline --output "${{ github.workspace }}/baseline-windows.json"
      - name: Build exact PR native extension
        run: python setup.py build_ext --inplace
      - name: Verify native patch in isolated processes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python ci/weakref_windows_probe.py --expect patched --output patched-windows.json
      - name: Run existing Python and nogil regression modules
        run: python -m pytest test/test_kiwipiepy.py test/test_nogil_safety.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weakref-windows-results
          path: |
            baseline-windows.json
            patched-windows.json
